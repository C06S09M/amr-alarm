<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>AMR 알람 로그인</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .login-page{min-height:100vh;display:grid;place-items:center;padding:20px}
    .login-box{width:min(100%,380px);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:24px}
    .login-box h1{margin:0 0 8px;font-size:21px}
    .login-box p{margin:0 0 20px}
    .login-box form{display:flex;flex-direction:column;gap:10px}
    .login-box label{font-size:12px;color:var(--muted)}
    .login-box input{width:100%;margin-top:6px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:11px;font:inherit}
    .login-box input:focus{outline:2px solid var(--accent);outline-offset:1px}
    .login-error{min-height:18px;color:var(--urgent);font-size:12px}
  </style>
</head>
<body class="login-page">
  <main class="login-box">
    <h1>AMR 캡처 알람</h1>
    <p class="muted">대시보드에 로그인하세요.</p>
    <form id="loginForm">
      <label>비밀번호<input id="password" type="password" autocomplete="current-password" required autofocus /></label>
      <p id="error" class="login-error" aria-live="polite"></p>
      <button class="primary-btn wide" type="submit">로그인</button>
    </form>
  </main>
  <script>
    const form = document.querySelector('#loginForm');
    const password = document.querySelector('#password');
    const error = document.querySelector('#error');
    fetch('/api/auth/status').then((r) => r.json()).then((status) => {
      if (!status.enabled || status.authenticated) location.assign('/');
    });
    form.onsubmit = async (event) => {
      event.preventDefault();
      error.textContent = '';
      const response = await fetch('/api/auth/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: password.value })
      });
      const result = await response.json();
      if (!response.ok) { error.textContent = result.error || '로그인에 실패했습니다.'; return; }
      location.assign('/');
    };
  </script>
</body>
</html>
